<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How much of your life do you spend travelling?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2414; --dark:#2b180c; --brown:#7a4b24; --caramel:#c68b3f; --caramel2:#d9a441;
  --mustard:#f2b705; --warm:#ffd24d; --beige:#f3dfb8; --cream:#fff1d0; --bg:#f5c76a;
  --head:var(--ink); --headglow:rgba(255,241,208,.65);
  --font:'Bisten','Fredoka',ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head:var(--cream);--headglow:rgba(43,24,12,.7);--bg:#3a2012}}
:root[data-theme="dark"]{--head:var(--cream);--headglow:rgba(43,24,12,.7);--bg:#3a2012}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--head);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;display:block;transform-origin:50% 62%;transition:transform 3s cubic-bezier(.2,.7,.2,1),filter 1s}
body.revealed #world{transform:scale(1.07);filter:saturate(.85)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,transparent 55%,rgba(43,24,12,.3) 100%)}

/* headline */
#hl{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 3.4vh);margin:0;width:min(94vw,1180px);text-align:center;
  font-weight:700;font-size:clamp(30px,5.5vw,92px);line-height:1.02;letter-spacing:-.012em;text-wrap:balance;color:var(--head);
  text-shadow:0 2px 0 var(--headglow),0 0 24px var(--headglow);transition:opacity .6s,transform .8s cubic-bezier(.3,.8,.2,1)}
body.revealed #hl{opacity:0;transform:translateX(-50%) translateY(-30px)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;animation:drop .85s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*26ms + 250ms)}
.ch i{display:inline-block;font-style:normal;transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-140ms)}
@keyframes drop{0%{transform:translateY(-1.2em) rotate(var(--r,-8deg)) scale(.55);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(calc(var(--amp,.1)*-.1em)) rotate(calc(var(--amp,.1)*3.2deg))}}

/* controls */
.controls{position:absolute;z-index:3;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,7vw,120px);
  transition:opacity .5s,transform .7s cubic-bezier(.3,.8,.2,1)}
body.revealed .controls{opacity:0;transform:translateY(40px);pointer-events:none}
.ctl{--ih:clamp(52px,8.2vh,76px);position:relative;z-index:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ctl.hrs{--dw:calc(var(--ih)*2.35)} .ctl.per{--dw:calc(var(--ih)*3.55)}
.plate{position:relative;background:var(--mustard);color:var(--dark);border:3px solid var(--dark);border-radius:16px;padding:8px 20px 7px;font-weight:700;
  font-size:clamp(14px,1.55vw,21px);letter-spacing:.07em;white-space:nowrap;box-shadow:0 5px 0 var(--dark),0 16px 20px rgba(30,15,5,.28);transform-origin:50% -10px;animation:sway 5.5s ease-in-out infinite}
.plate::before,.plate::after{content:'';position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--dark);opacity:.75}
.plate::before{left:7px}.plate::after{right:7px}
.per .plate{animation-delay:-2.6s}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.frame{position:relative;width:var(--dw);height:calc(var(--ih)*3);border-radius:28px;background:var(--dark);
  box-shadow:0 0 0 4px var(--dark),0 0 0 8px var(--mustard),0 11px 0 8px var(--dark),0 28px 34px 6px rgba(30,15,5,.35);overflow:hidden}
.drum{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;outline:none;cursor:grab;-webkit-overflow-scrolling:touch}
.drum::-webkit-scrollbar{display:none}
.drum:active{cursor:grabbing}
.drum ul{list-style:none;margin:0;padding:var(--ih) 0}
.drum li{height:var(--ih);display:flex;align-items:center;justify-content:center;gap:.28em;scroll-snap-align:center;color:var(--cream);opacity:0;user-select:none;-webkit-user-select:none;will-change:transform,opacity;white-space:nowrap}
.drum li b{font-size:calc(var(--ih)*.74);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.drum li i{font-style:normal;font-weight:600;font-size:calc(var(--ih)*.25);letter-spacing:.07em;opacity:.8;align-self:flex-end;padding-bottom:calc(var(--ih)*.17)}
.drum li.on b{color:var(--warm);text-shadow:0 0 22px rgba(255,201,60,.4)}
.drum:focus-visible{box-shadow:inset 0 0 0 3px var(--warm)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--dark) 0,rgba(43,24,12,.35) 28%,transparent 38%,transparent 62%,rgba(43,24,12,.35) 72%,var(--dark) 100%)}
.lens{position:absolute;left:0;right:0;top:var(--ih);height:var(--ih);pointer-events:none;background:linear-gradient(180deg,rgba(255,210,77,.05),rgba(255,210,77,.16),rgba(255,210,77,.05));border-block:2px solid rgba(255,210,77,.45)}
.post{position:absolute;z-index:-1;top:calc(100% - 4px);left:50%;width:16px;margin-left:-8px;height:34vh;border-radius:0 0 4px 4px;
  background:repeating-linear-gradient(180deg,var(--dark) 0 18px,var(--mustard) 18px 36px);box-shadow:0 0 0 3px var(--dark)}

/* result */
#result{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;pointer-events:none;cursor:pointer;
  background:radial-gradient(ellipse at 50% 55%,rgba(43,24,12,.58),rgba(43,24,12,.9));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:opacity .7s,visibility 0s .7s;padding:env(safe-area-inset-top,0px) 4vw env(safe-area-inset-bottom,0px)}
body.revealed #result{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .7s}
.stack{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,1vh,12px);color:var(--cream);max-width:100%}
.lab{font-weight:700;font-size:clamp(15px,2.3vw,32px);letter-spacing:.16em;color:var(--caramel2);opacity:0;transform:translateY(14px);transition:all .7s cubic-bezier(.3,.8,.2,1)}
.ctx{font-weight:600;font-size:clamp(12px,1.4vw,20px);letter-spacing:.12em;opacity:0;transform:translateY(14px);transition:all .7s .15s cubic-bezier(.3,.8,.2,1);margin-bottom:clamp(6px,2vh,26px)}
.lab.in{opacity:1;transform:none}.ctx.in{opacity:.78;transform:none}
.row{display:flex;align-items:baseline;justify-content:center;gap:.22em;font-weight:700;line-height:.98;font-size:clamp(38px,min(9vw,11.4vh),132px);opacity:0;transform:translateY(60px) scale(.82);
  transition:opacity .5s,transform .9s cubic-bezier(.3,1.5,.5,1);max-width:100%;
  text-shadow:0 .035em 0 var(--brown),0 .07em 0 var(--dark),0 .12em .2em rgba(0,0,0,.35)}
.row .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .unit{font-size:.34em;letter-spacing:.06em;color:var(--caramel2);text-shadow:0 .06em 0 var(--dark)}
.row.in{opacity:1;transform:none}
.row.yrs{font-size:clamp(62px,min(17.5vw,21vh),260px);color:var(--warm);margin-top:clamp(2px,1.4vh,18px);
  text-shadow:0 .03em 0 #c98c0a,0 .06em 0 var(--brown),0 .1em 0 var(--dark),0 0 .5em rgba(255,201,60,.35),0 .16em .22em rgba(0,0,0,.4)}
.row.yrs .unit{color:var(--cream);font-size:.3em}
.row.yrs.done{animation:stamp .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(1.35) rotate(-2deg)}55%{transform:scale(.96) rotate(.6deg)}100%{transform:none}}

@media (max-width:560px){
  #hl{font-size:8.7vw;top:calc(env(safe-area-inset-top,0px) + 2.6vh)}
  .controls{flex-direction:column;align-items:center;gap:16px;bottom:calc(3.2vh + env(safe-area-inset-bottom,0px))}
  .ctl{--ih:clamp(38px,5.6vh,48px);flex-direction:row;gap:16px;justify-content:center;width:100%}
  .plate{width:38vw;white-space:normal;text-align:center;padding:8px 10px;line-height:1.1;font-size:15px}
  .ctl.hrs{--dw:calc(var(--ih)*2.9)} .ctl.per{--dw:calc(var(--ih)*3.9)}
  .ctl.hrs .frame,.ctl.per .frame{width:46vw}
  .post{display:none}
  .frame{border-radius:22px}
}
@media (max-height:520px) and (min-width:561px){.post{display:none}.controls{bottom:6vh}}
@media (prefers-reduced-motion:reduce){.ch,.ch i,.plate{animation:none!important}#world{transition:none}}
</style>
</head>
<body>
<main id="stage">
  <canvas id="world" aria-hidden="true"></canvas>
  <h1 id="hl" aria-label="How much of your life do you spend travelling?"></h1>
  <section class="controls" id="controls">
    <div class="ctl hrs">
      <div class="plate">HOURS / DAY</div>
      <div class="frame"><div class="drum" id="dHrs" tabindex="0" role="spinbutton" aria-label="Hours of travel per day"><ul></ul></div><div class="shade"></div><div class="lens"></div></div>
      <div class="post"></div>
    </div>
    <div class="ctl per">
      <div class="plate">TIME PERIOD</div>
      <div class="frame"><div class="drum" id="dPer" tabindex="0" role="spinbutton" aria-label="Time period"><ul></ul></div><div class="shade"></div><div class="lens"></div></div>
      <div class="post"></div>
    </div>
  </section>
  <section id="result" aria-live="polite">
    <div class="stack">
      <div class="lab" id="rLab">TOTAL TIME TRAVELLING</div>
      <div class="ctx" id="rCtx"></div>
      <div class="row" data-k="h"><span class="num">0</span><span class="unit">HOURS</span></div>
      <div class="row" data-k="d"><span class="num">0</span><span class="unit">DAYS</span></div>
      <div class="row" data-k="w"><span class="num">0</span><span class="unit">WEEKS</span></div>
      <div class="row yrs" data-k="y"><span class="num">0</span><span class="unit">YEARS</span></div>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';
const cv=document.getElementById('world'), ctx=cv.getContext('2d');
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;
const C={dark:'#2b180c',ink:'#3b2414',brown:'#7a4b24',brown2:'#5a3a26',caramel:'#c68b3f',caramel2:'#d9a441',mustard:'#f2b705',warm:'#ffd24d',beige:'#f3dfb8',beige2:'#e3c48a',cream:'#fff1d0',olive:'#8f8236',olive2:'#756a2b'};

/* ---------- helpers ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function frr(c,x,y,w,h,r,col){rr(c,x,y,w,h,r);c.fillStyle=col;c.fill()}
function circ(c,x,y,r,col){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=col;c.fill()}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixc(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
const pick=a=>a[(Math.random()*a.length)|0];

/* ---------- geometry ---------- */
let W,H,DPR,S,E,gy,RD,walkY,divY,laneY,laneK,portrait,flyY,metroY;
const L={};
function mk(w,h,fn){const k=document.createElement('canvas');k.width=Math.ceil(w*DPR);k.height=Math.ceil(h*DPR);const c=k.getContext('2d');c.scale(DPR,DPR);fn(c,w,h);return k}

function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  portrait=W<620||W<H*.8;
  S=clamp(H/860,.62,1.25)*(portrait?1.04:1);
  E=portrait?S*.64:S;
  gy=H*(portrait?.40:.585);RD=portrait?H*.30:H*.335;
  walkY=gy+RD*.93;divY=gy+RD*.625;
  laneY=[gy+RD*.19,gy+RD*.45,gy+RD*.80];laneK=[.55,.76,1.02];
}

/* ---------- static layers ---------- */
function buildFar(){
  const TW=Math.round(Math.max(W*1.25,1500)),h=Math.round(330*E),rn=rng(7);
  const cols=['#efd8a6','#e9cd94','#f2e0b4','#e4c283','#edd3a0'];
  const items=[];let x=-30*E;
  while(x<TW+60*E){const w=(50+rn()*80)*E,bh=(70+rn()*rn()*190+30)*E;items.push({x,w,bh,col:cols[(rn()*5)|0],k:rn()});x+=w*(.5+rn()*.4)}
  const c=mk(TW,h,c=>{
    for(const o of [-TW,0,TW])for(const b of items){
      const x=b.x+o;if(x>TW||x+b.w<0)continue;
      frr(c,x,h-b.bh,b.w,b.bh+10,7*E,b.col);
      for(let wy=h-b.bh+12*E;wy<h-14*E;wy+=17*E)for(let wx=x+8*E;wx<x+b.w-10*E;wx+=14*E)frr(c,wx,wy,6*E,8*E,2*E,'rgba(176,128,60,.2)');
      if(b.k<.22){frr(c,x+b.w*.3,h-b.bh-16*E,22*E,16*E,5*E,'#d6b377')}
      else if(b.k<.4){c.fillStyle='#d6b377';c.fillRect(x+b.w*.5-1.5*E,h-b.bh-34*E,3*E,34*E);circ(c,x+b.w*.5,h-b.bh-36*E,3*E,'#d6b377')}
      else if(b.k<.52){c.beginPath();c.arc(x+b.w/2,h-b.bh,b.w*.32,Math.PI,TAU);c.fillStyle=b.col;c.fill();c.fillStyle='#d6b377';c.fillRect(x+b.w/2-1.5*E,h-b.bh-b.w*.32-12*E,3*E,12*E)}
    }
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(252,228,170,0)');g.addColorStop(1,'rgba(252,228,170,.6)');c.fillStyle=g;c.fillRect(0,0,TW,h);
  });
  L.far={c,TW,h};
}
function buildMid(){
  const TW=Math.round(Math.max(W*1.5,1900)),h=Math.round(300*E),rn=rng(21);
  const cols=['#c9954f','#bb8340','#d8aa66','#a8722f','#e0b673','#c58a45'];
  const items=[];let x=-20*E,i=0;
  while(x<TW+40*E){const w=(84+rn()*70)*E,bh=(90+rn()*115)*E;items.push({x,w,bh,col:cols[(rn()*6)|0],k:rn(),frame:(i===3||i===9)});x+=w+(rn()*8-3)*E;i++}
  const lights=[],cranes=[];
  const c=mk(TW,h,c=>{
    for(const o of [-TW,0,TW])for(const b of items){
      const x=b.x+o;if(x>TW||x+b.w<0)continue;const top=h-b.bh;
      if(b.frame){
        const fl=34*E;
        for(let fy=top+10*E;fy<h-4*E;fy+=fl){c.fillStyle='#a9733a';c.fillRect(x,fy,b.w,5*E)}
        for(let fx=x;fx<=x+b.w;fx+=(b.w/3)){c.fillStyle='#8a5a32';c.fillRect(fx-3*E,top+10*E,6*E,b.bh)}
        for(let r=0;r<4;r++){c.fillStyle='#5a3a26';c.fillRect(x+6*E+r*(b.w/4),top-12*E,2*E,14*E)}
        // tower crane
        const mx=x+b.w*.5,my=top-6*E,mh=120*E;
        c.fillStyle='#e0a412';c.fillRect(mx-4*E,my-mh,8*E,mh);
        c.strokeStyle='#8a5a12';c.lineWidth=1.4*E;c.beginPath();for(let yy=my-mh;yy<my;yy+=14*E){c.moveTo(mx-4*E,yy);c.lineTo(mx+4*E,yy+14*E);c.moveTo(mx+4*E,yy);c.lineTo(mx-4*E,yy+14*E)}c.stroke();
        c.fillStyle='#e0a412';c.fillRect(mx-46*E,my-mh-8*E,200*E,7*E);
        c.fillStyle='#5a3a26';c.fillRect(mx-60*E,my-mh-8*E,16*E,12*E);
        c.beginPath();c.moveTo(mx,my-mh-42*E);c.lineTo(mx-4*E,my-mh-8*E);c.lineTo(mx+4*E,my-mh-8*E);c.fillStyle='#e0a412';c.fill();
        c.strokeStyle='#8a5a12';c.lineWidth=1.2*E;c.beginPath();c.moveTo(mx,my-mh-42*E);c.lineTo(mx+150*E,my-mh-8*E);c.moveTo(mx,my-mh-42*E);c.lineTo(mx-44*E,my-mh-8*E);c.stroke();
        cranes.push({x:mx+120*E,y:my-mh-1*E,o});
        continue;
      }
      frr(c,x,top,b.w,b.bh+10,6*E,b.col);
      c.fillStyle='rgba(60,30,10,.13)';c.fillRect(x+b.w-9*E,top+4*E,9*E,b.bh);
      const fl=36*E;
      for(let fy=top+16*E;fy<h-66*E;fy+=fl){
        for(let wx=x+11*E;wx<x+b.w-24*E;wx+=30*E){
          frr(c,wx,fy,18*E,21*E,5*E,'#5a3a26');
          if(rn()<.45)lights.push({x:wx,y:fy});
          frr(c,wx-3*E,fy+21*E,24*E,4*E,2*E,'#7a4b24');
          if(rn()<.18)frr(c,wx+12*E,fy+14*E,10*E,7*E,2*E,'#e7d3a8');
        }
      }
      frr(c,x+4*E,h-46*E,b.w-8*E,46*E,5*E,'#8a5a32');
      for(let sx=x+6*E,j=0;sx<x+b.w-16*E;sx+=13*E,j++)frr(c,sx,h-54*E,13*E,11*E,2*E,j%2?C.brown2:C.mustard);
      if(b.k<.3){c.fillStyle='#3b2414';c.fillRect(x+b.w*.25,top-6*E,3*E,10*E);c.fillRect(x+b.w*.25+24*E,top-6*E,3*E,10*E);frr(c,x+b.w*.25-3*E,top-24*E,36*E,20*E,6*E,'#3b2414')}
      else if(b.k<.55){frr(c,x+8*E,top-30*E,b.w-16*E,26*E,5*E,C.mustard);for(let q=0;q<4;q++)frr(c,x+16*E+q*((b.w-48*E)/4),top-22*E,((b.w-48*E)/4)-6*E,5*E,2*E,C.brown2)}
      else frr(c,x-2*E,top-6*E,b.w+4*E,9*E,4*E,'#8a5a32');
    }
  });
  const lc=mk(TW,h,c=>{for(const l of lights)frr(c,l.x+2*E,l.y+2*E,14*E,17*E,4*E,'rgba(255,214,110,.95)')});
  L.mid={c,lc,TW,h,cranes};
}
function buildMetro(){
  const P=Math.round(380*E),TW=P*6,h=Math.round(250*E),yd=Math.round(44*E);
  const c=mk(TW,h,c=>{
    for(let i=0;i<6;i++){const x=i*P+P/2;
      c.beginPath();c.moveTo(x-18*E,yd+40*E);c.lineTo(x+18*E,yd+40*E);c.lineTo(x+13*E,h);c.lineTo(x-13*E,h);c.closePath();c.fillStyle='#8a5a32';c.fill();
      frr(c,x-34*E,yd+28*E,68*E,16*E,7*E,'#7a4b24');
      c.fillStyle='rgba(255,230,170,.16)';c.fillRect(x-8*E,yd+44*E,5*E,h);
    }
    c.fillStyle=C.caramel;c.fillRect(0,yd,TW,12*E);
    c.fillStyle='#8a5a32';c.fillRect(0,yd+12*E,TW,22*E);

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,gy);
  g.addColorStop(0,mixc('#fbe6ae','#2e1a10',dk));g.addColorStop(.55,mixc('#f8d284','#5d3519',dk));g.addColorStop(1,mixc('#f5bd5e','#c4742f',dk));
  ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,gy+60);
  const sx=W*.78,sy=gy-(portrait?250:250)*E;
  const rg=ctx.createRadialGradient(sx,sy,0,sx,sy,300*E);rg.addColorStop(0,'rgba(255,244,200,.8)');rg.addColorStop(1,'rgba(255,244,200,0)');
  ctx.globalAlpha=1-dk*.5;ctx.fillStyle=rg;ctx.fillRect(sx-320*E,sy-320*E,640*E,640*E);ctx.globalAlpha=1;
  circ(ctx,sx,sy,62*E,mixc('#fff4c8','#ffb454',dk));
  const cl=[[.1,.55,1.2,3],[.35,.3,.8,2],[.58,.62,1,4],[.88,.38,.9,3],[1.1,.5,1.1,2.5]];
  const span=W+500;
  for(const q of cl){const x=(((q[0]*W+camX*q[3]*.6)%span)+span)%span-250;const y=gy-(150+q[1]*190)*E,s=q[2]*E;
    ctx.fillStyle=mixc('#fff3d6','#8a5a3a',dk);ctx.globalAlpha=.5;
    frr(ctx,x-70*s,y,150*s,22*s,11*s,ctx.fillStyle);circ(ctx,x-18*s,y,22*s,ctx.fillStyle);circ(ctx,x+28*s,y+2*s,17*s,ctx.fillStyle);ctx.globalAlpha=1}
}
function drawTrain(dt){
  const carL=150*E,gap=7*E,ch=48*E,len=5*carL+4*gap;
  if(!train.on){train.wait-=dt*Math.max(tsc,.2);if(train.wait<=0){train.on=true;train.dir=Math.random()<.5?1:-1;train.x=train.dir>0?-20:W+20}return}
  train.x+=train.dir*380*E*dt*tsc*(reduced?.3:1)*(1);
  if((train.dir>0&&train.x>W+len+40)||(train.dir<0&&train.x<-len-40)){train.on=false;train.wait=9+Math.random()*9;return}
  const yTop=metroY+L.metro.yd-ch+2*E;
  ctx.save();ctx.translate(train.x,yTop);ctx.scale(train.dir,1);
  for(let i=0;i<5;i++){const x=-(i+1)*carL-i*gap;
    frr(ctx,x,0,carL,ch,12*E,C.caramel2);frr(ctx,x,0,carL,9*E,9*E,C.brown);frr(ctx,x+5*E,ch-14*E,carL-10*E,6*E,3*E,C.brown);
    for(let j=0;j<6;j++){frr(ctx,x+10*E+j*22.5*E,13*E,18*E,16*E,5*E,'rgba(255,241,208,.94)');circ(ctx,x+19*E+j*22.5*E,26*E,3.2*E,'rgba(90,58,38,.8)')}
  }
  frr(ctx,-24*E,12*E,20*E,19*E,6*E,'#4a2f1c');circ(ctx,-3*E,ch-12*E,5*E,C.cream);circ(ctx,-2*E,ch-12*E,2*E,C.dark);
  ctx.restore();
}
function jcb(x,y,k,t){
  ctx.save();ctx.translate(x,y);ctx.scale(k,k);
  shadow(60,6);frr(ctx,-48,-18,96,18,9,C.dark);for(let i=0;i<4;i++)circ(ctx,-34+i*22,-9,6,C.brown2);
  frr(ctx,-40,-52,70,36,10,C.mustard);frr(ctx,-6,-84,40,36,8,C.mustard);frr(ctx,0,-78,28,22,5,'#4a2f1c');circ(ctx,14,-66,6,'#c98f55');frr(ctx,-10,-88,48,6,3,C.dark);
  frr(ctx,-44,-40,10,16,4,C.brown2);
  ctx.translate(26,-46);ctx.rotate(-.95+Math.sin(t*.8)*.12);frr(ctx,0,-6,70,12,6,C.mustard);ctx.translate(70,0);ctx.rotate(1.5+Math.sin(t*.8+1)*.18);frr(ctx,0,-5,52,10,5,C.caramel);ctx.translate(52,0);ctx.rotate(.9+Math.sin(t*1.6)*.25);frr(ctx,-4,-4,28,24,6,C.dark);
  ctx.restore();
}
function drawV(v){
  const I2=clamp((I-.55)/.45,0,1);
  const wz=Math.sin(T*v.ww+v.wy);
  v.yy=(v.lane===3?flyY+L.fly.yf:laneY[v.lane])+v.yoff+wz*v.amp0*I2*RD*.05;
  v.tilt=Math.cos(T*v.ww+v.wy)*v.amp0*I2*.07*(v.lane===3?0:1);
  const bob=Math.sin(T*v.bf+v.ph)*v.ba*(.4+Math.min(v.cur/(150*S),1));
  ctx.save();ctx.translate(v.x,v.yy);ctx.scale(v.k*v.dir,v.k);ctx.rotate(v.tilt*v.dir);
  shadow(LEN[v.type]*.5,8);
  ctx.translate(0,bob);
  DR[v.type](v);
  if(v.honk>0){const a=Math.min(1,v.honk*2.2);ctx.strokeStyle='rgba(255,241,208,'+a+')';ctx.lineWidth=3;ctx.lineCap='round';const hx=HL[v.type][0]+12,hy=-HL[v.type][1]-24;for(let q=0;q<2;q++){ctx.beginPath();ctx.arc(hx,hy,12+q*10+(.7-v.honk)*14,-.7,.7);ctx.stroke()}}
  ctx.restore();
  glows.push({x:v.x+v.dir*HL[v.type][0]*v.k,y:v.yy-HL[v.type][1]*v.k,dir:v.dir,k:v.k});
}
function sigHead(x,y,ph){
  ctx.save();ctx.translate(x,y);
  frr(ctx,-9*S,0,18*S,52*S,7*S,C.dark);
  const s=((T/11+ph)%1),st=s<.42?2:s<.5?1:0;
  const cols=['#e0532f','#ffc533','#7ab648'];
  for(let i=0;i<3;i++){const on=st===i;circ(ctx,0,(11+i*15)*S,5.2*S,on?cols[i]:'rgba(120,90,60,.45)');
    if(on&&dk>.05){const g=ctx.createRadialGradient(0,(11+i*15)*S,0,0,(11+i*15)*S,30*S);g.addColorStop(0,cols[i]);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.5*dk;ctx.fillStyle=g;ctx.fillRect(-30*S,(11+i*15)*S-30*S,60*S,60*S);ctx.globalAlpha=1}}
  ctx.restore();
}

/* ---------- frame ---------- */
let last=performance.now(),dkTimer=0,ampSent=-1;
function themeDark(){const t=root.getAttribute('data-theme');if(t==='dark')return 1;if(t==='light')return 0;return matchMedia('(prefers-color-scheme: dark)').matches?1:0}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  tsc+=(tsTarget-tsc)*Math.min(1,dt*2.4);
  I+=(It-I)*Math.min(1,dt*1.5);
  dkTimer-=dt;if(dkTimer<=0){dkT=themeDark();dkTimer=.5}
  dk+=(dkT-dk)*Math.min(1,dt*2);
  const I2=clamp((I-.55)/.45,0,1);
  const mdt=dt*tsc*(reduced?.25:1);
  T+=dt*(.15+.85*tsc)*(reduced?.3:1);
  const cam=lerp(1,.6,I);
  camX+=mdt*cam;
  shake*=Math.pow(.02,dt);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);
  ctx.clearRect(-20,-20,W+40,H+40);
  glows.length=0;

  drawSky();
  tileDraw(L.far,gy-L.far.h+10*E,camX*5);
  const mo=camX*13,my=gy-L.mid.h+8*E;
  tileDraw(L.mid,my,mo);
  // crane hooks
  eachTile(L.mid.TW,mo,x0=>{for(const cr of L.mid.cranes){if(cr.o!==0)continue;const hx=x0+cr.x+Math.sin(T*.6)*6*E,hy=my+cr.y,len=(40+Math.sin(T*.4)*14)*E;ctx.strokeStyle=C.ink;ctx.lineWidth=1.3*E;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx,hy+len);ctx.stroke();frr(ctx,hx-5*E,hy+len,10*E,8*E,2*E,C.dark)}});
  ctx.fillStyle='rgba(222,170,100,'+(.14*I)+')';ctx.fillRect(-40,gy-340*E,W+80,340*E+8);
  tileDraw(L.metro,metroY,camX*28);
  drawTrain(mdt);
  tileDraw(L.fly,flyY,camX*52);

  // flyover vehicles
  for(const v of vehicles)if(v.lane===3)drawV(v);

  // road
  const rg=ctx.createLinearGradient(0,gy,0,walkY);rg.addColorStop(0,'#6e4729');rg.addColorStop(1,'#3d2515');ctx.fillStyle=rg;ctx.fillRect(-40,gy,W+80,walkY-gy+10);
  const ro=camX*108;
  tileDraw(L.con,gy-L.con.top,ro);
  eachTile(L.con.TW,ro,x0=>{
    for(const j of L.con.jcb)jcb(x0+j.x,gy-L.con.top+j.y,S*.78,T);
    for(const l of L.con.lamps){const on=(Math.floor(T*2.2+l.x*.01)%2)===0;circ(ctx,x0+l.x,gy-L.con.top+l.y,4.2*S,on?C.warm:'rgba(90,58,38,.8)');if(on){const g=ctx.createRadialGradient(x0+l.x,gy-L.con.top+l.y,0,x0+l.x,gy-L.con.top+l.y,22*S);g.addColorStop(0,'rgba(255,210,77,.55)');g.addColorStop(1,'rgba(255,210,77,0)');ctx.fillStyle=g;ctx.fillRect(x0+l.x-22*S,gy-L.con.top+l.y-22*S,44*S,44*S)}}
  });
  tileDraw(L.marks,gy,ro);

  // vehicles update & draw lanes 0,1
  updateVehicles(dt,mdt,I2);
  for(let l=0;l<3;l++){
    if(l===2){
      tileDraw(L.div,divY-L.div.bY,ro);
      eachTile(L.div.TW,ro,x0=>{for(const sx of [520*S,2080*S])sigHead(x0+sx-56*S,divY-L.div.bY+L.div.bY-190*S+5*S,sx>1000?.5:0)});
    }
    const arr=vehicles.filter(v=>v.lane===l).sort((a,b)=>(a.yy||0)-(b.yy||0));
    for(const v of arr)drawV(v);
  }
  tileDraw(L.fg,walkY-L.fg.yK,camX*215);

  // dusk + lights
  if(dk>.01){
    ctx.fillStyle='rgba(34,16,6,'+(.5*dk)+')';ctx.fillRect(-40,-40,W+80,H+80);
    ctx.save();ctx.globalAlpha=dk;tileDraw(L.mid,my,mo,L.mid.lc);ctx.restore();
    ctx.globalCompositeOperation='lighter';
    eachTile(L.div.TW,ro,x0=>{for(let k=0;k<6;k++){const x=x0+(260+k*520)*S,y=divY-L.div.bY+L.div.bY-176*S;for(const sg of [-40,40]){const g=ctx.createRadialGradient(x+sg*S,y,0,x+sg*S,y,90*S);g.addColorStop(0,'rgba(255,200,110,.5)');g.addColorStop(1,'rgba(255,200,110,0)');ctx.globalAlpha=dk;ctx.fillStyle=g;ctx.fillRect(x+sg*S-90*S,y-90*S,180*S,260*S)}}});
    for(const g of glows){const gx=g.x+g.dir*34*g.k,gr=ctx.createRadialGradient(gx,g.y,0,gx,g.y,120*g.k);gr.addColorStop(0,'rgba(255,214,120,.5)');gr.addColorStop(1,'rgba(255,214,120,0)');ctx.globalAlpha=dk;ctx.fillStyle=gr;ctx.fillRect(gx-120*g.k,g.y-70*g.k,240*g.k,140*g.k)}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  const amp=Math.round((.1+.9*I)*50)/50;if(amp!==ampSent){ampSent=amp;root.style.setProperty('--amp',amp)}
  requestAnimationFrame(frame);
}
function updateVehicles(dt,mdt,I2){
  const n=targetCounts();const cnt=[0,0,0,0];
  for(const v of vehicles)cnt[v.lane]++;
  for(let l=0;l<4;l++)if(cnt[l]<n[l]&&Math.random()<dt*1.6){
    const k=l===3?.36*E:laneK[l]*S;const dir=l===2?1:-1;trySpawn(l,dir>0?-130*k-60:W+130*k+60);
  }
  const speedMul=lerp(1,.62,I)*(l=>1)(0);
  for(let i=vehicles.length-1;i>=0;i--){
    const v=vehicles[i];
    let target=v.spd*speedMul*(1+.3*I2*Math.sin(T*.9+v.ph));
    let lead=null,ld=1e9;
    for(const u of vehicles){if(u===v||u.lane!==v.lane)continue;const d=(u.x-v.x)*v.dir;if(d>0&&d<ld){ld=d;lead=u}}
    if(lead){const need=(LEN[v.type]*v.k+LEN[lead.type]*lead.k)*.5+lerp(24,-34,I)*S;const f=clamp((ld-need)/(70*S),0,1);if(f<1)target=lerp(Math.min(target,lead.cur*.85),target,f)}
    v.cur+=(target-v.cur)*Math.min(1,dt*3);
    const dx=v.dir*v.cur*mdt;v.x+=dx;v.rot+=Math.abs(dx)/(WR[v.type]*v.k)*v.dir;
    if(v.honk>0)v.honk-=dt;else if(I>.5&&Math.random()<dt*.14*I2+dt*.02)v.honk=.7;
    if((v.dir>0&&v.x>W+320*v.k+200)||(v.dir<0&&v.x<-320*v.k-200))vehicles.splice(i,1);
  }
}

/* ---------- headline ---------- */
(function(){
  const h=document.getElementById('hl'),txt='How much of your life do you spend travelling?';let i=0;
  txt.split(' ').forEach((w,wi,a)=>{const s=document.createElement('span');s.className='w';s.setAttribute('aria-hidden','true');
    for(const chr of w){const c=document.createElement('span');c.className='ch';c.style.setProperty('--i',i);c.style.setProperty('--r',(i%2?9:-9)+'deg');const q=document.createElement('i');q.textContent=chr;c.appendChild(q);s.appendChild(c);i++}
    h.appendChild(s);if(wi<a.length-1){h.appendChild(document.createTextNode(' '));i++}});
})();

/* ---------- drums ---------- */
let holding=0,ready=false,revealed=false,revealTimer=0;
function drum(el,items,start,cb,aria){
  const sc=el,ul=sc.querySelector('ul');
  const lis=items.map((it,i)=>{const li=document.createElement('li');li.innerHTML=it.html;li.addEventListener('click',()=>{if(!moved)go(i)});ul.appendChild(li);return li});
  let ih=60,idx=start,raf=0,moved=false;
  const measure=()=>{ih=lis[0].offsetHeight||60};
  function paint(){raf=0;const f=sc.scrollTop/ih;const lo=Math.max(0,Math.floor(f)-3),hi=Math.min(lis.length-1,Math.ceil(f)+3);
    for(let i=Math.max(0,lo-2);i<=Math.min(lis.length-1,hi+2);i++){
      const li=lis[i];if(i<lo||i>hi){li.style.opacity='0';continue}
      const d=i-f,a=Math.abs(d);
      li.style.transform='perspective(420px) rotateX('+clamp(-d*34,-80,80)+'deg) scale('+(1-Math.min(a,2.2)*.2)+')';
      li.style.opacity=String(clamp(1-a*.5,.08,1));li.classList.toggle('on',a<.5)}
    const ni=clamp(Math.round(f),0,lis.length-1);
    if(ni!==idx){idx=ni;sc.setAttribute('aria-valuetext',items[idx].aria);cb(idx)}
  }
  const go=i=>sc.scrollTo({top:clamp(i,0,lis.length-1)*ih,behavior:reduced?'auto':'smooth'});
  sc.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(paint);poke()},{passive:true});
  sc.addEventListener('keydown',e=>{const m={ArrowUp:-1,ArrowDown:1,PageUp:-5,PageDown:5};if(e.key in m){e.preventDefault();go(idx+m[e.key])}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(lis.length-1)}});
  sc.addEventListener('touchstart',()=>{holding=1},{passive:true});
  sc.addEventListener('touchend',()=>{holding=0;poke()},{passive:true});sc.addEventListener('touchcancel',()=>{holding=0},{passive:true});
  let drag=false,sy=0,st=0;
  sc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag=true;moved=false;sy=e.clientY;st=sc.scrollTop;sc.style.scrollSnapType='none';holding=1;sc.setPointerCapture(e.pointerId)});
  sc.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-sy;if(Math.abs(dy)>4)moved=true;sc.scrollTop=st-dy});
  const up=()=>{if(!drag)return;drag=false;holding=0;sc.style.scrollSnapType='';sc.scrollTo({top:Math.round(sc.scrollTop/ih)*ih,behavior:'smooth'});setTimeout(()=>{moved=false},60);poke()};
  sc.addEventListener('pointerup',up);sc.addEventListener('pointercancel',up);
  function place(){measure();sc.style.scrollSnapType='none';sc.scrollTop=idx*ih;paint();requestAnimationFrame(()=>{sc.style.scrollSnapType=''})}
  addEventListener('resize',()=>{clearTimeout(place.t);place.t=setTimeout(place,160)});
  sc.setAttribute('aria-valuetext',items[idx].aria);
  requestAnimationFrame(()=>requestAnimationFrame(place));
  return{get idx(){return idx}};
}
const hours=[];for(let n=1;n<=10;n++)hours.push({n,html:'<b>'+n+'</b>',aria:n+(n===1?' hour per day':' hours per day')});
const periods=[];
for(let n=2;n<=20;n++)periods.push({n,wd:n,u:'day',lab:'DAYS',html:'<b>'+n+'</b><i>DAYS</i>',aria:n+' days'});
for(let n=1;n<=11;n++)periods.push({n,wd:n*250/12,u:'month',lab:n===1?'MONTH':'MONTHS',html:'<b>'+n+'</b><i>'+(n===1?'MONTH':'MONTHS')+'</i>',aria:n+(n===1?' month':' months')});
for(let n=1;n<=60;n++)periods.push({n,wd:n*250,u:'year',lab:n===1?'YEAR':'YEARS',html:'<b>'+n+'</b><i>'+(n===1?'YEAR':'YEARS')+'</i>',aria:n+(n===1?' year':' years')});
let hIdx=0,pIdx=19+11+9;
function poke(){if(!ready)return;clearTimeout(revealTimer);revealTimer=setTimeout(function chk(){if(holding){revealTimer=setTimeout(chk,300);return}reveal()},1000)}
drum(document.getElementById('dHrs'),hours,hIdx,i=>{hIdx=i;It=IMAP[i]},'');
drum(document.getElementById('dPer'),periods,pIdx,i=>{pIdx=i},'');
setTimeout(()=>{ready=true},700);

/* ---------- reveal ---------- */
const body=document.body,resEl=document.getElementById('result');
const rows={};resEl.querySelectorAll('.row').forEach(r=>rows[r.dataset.k]=r);
const rLab=document.getElementById('rLab'),rCtx=document.getElementById('rCtx');
let timers=[],tokens=0,revealAt=0;
const decs=v=>v>=1000?0:v>=10?1:v>=1?2:v>=.1?3:v>=.01?4:5;
const fmt=(v,d)=>v.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:d});
function countUp(row,val,ms,ease,tk){
  const d=decs(val),num=row.querySelector('.num');
  if(reduced){num.textContent=fmt(val,d);return Promise.resolve()}
  return new Promise(res=>{const t0=performance.now();(function step(n){if(tk!==tokens)return res();const p=clamp((n-t0)/ms,0,1);num.textContent=fmt(val*ease(p),d);if(p<1)requestAnimationFrame(step);else res()})(t0)});
}
const easeOut=p=>1-Math.pow(1-p,4),easeOut5=p=>1-Math.pow(1-p,5);
function reveal(){
  if(revealed)return;revealed=true;revealAt=performance.now();const tk=++tokens;
  const h=hIdx+1,p=periods[pIdx],totalH=h*p.wd,days=totalH/24,weeks=days/7,years=days/365;
  rCtx.textContent=h+(h===1?' HOUR':' HOURS')+' / DAY FOR '+p.n+' '+p.lab;
  const vals={h:totalH,d:days,w:weeks,y:years};
  const unit=(k,v,s,pl)=>{const t=fmt(v,decs(v));rows[k].querySelector('.unit').textContent=t==='1'?s:pl};
  unit('h',totalH,'HOUR','HOURS');unit('d',days,'DAY','DAYS');unit('w',weeks,'WEEK','WEEKS');unit('y',years,'YEAR','YEARS');
  body.classList.add('revealed');tsTarget=.04;
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  const speed=reduced?.01:1;
  at(150*speed,()=>rLab.classList.add('in'));
  at(380*speed,()=>rCtx.classList.add('in'));
  const go=(k,ms,dur,ease)=>at(ms*speed,()=>{rows[k].classList.add('in');countUp(rows[k],vals[k],dur*speed,ease,tk)});
  go('h',800,1500,easeOut);go('d',1350,1400,easeOut);go('w',1900,1300,easeOut);
  at(2600*speed,()=>{rows.y.classList.add('in');countUp(rows.y,vals.y,2000*speed,easeOut5,tk).then(()=>{if(tk!==tokens)return;rows.y.classList.add('done');shake=reduced?0:14;})});
  at(5600*speed,()=>{if(tk===tokens)tsTarget=.4});
}
function dismiss(){
  if(!revealed||performance.now()-revealAt<1600)return;
  revealed=false;tokens++;timers.forEach(clearTimeout);timers=[];
  body.classList.remove('revealed');tsTarget=1;
  setTimeout(()=>{if(revealed)return;for(const k in rows){rows[k].classList.remove('in','done');rows[k].querySelector('.num').textContent='0'}rLab.classList.remove('in');rCtx.classList.remove('in')},750);
}
resEl.addEventListener('pointerdown',dismiss);
resEl.addEventListener('wheel',dismiss,{passive:true});
resEl.addEventListener('touchmove',dismiss,{passive:true});
addEventListener('keydown',e=>{if(revealed&&!e.metaKey&&!e.ctrlKey&&!e.altKey)dismiss()});

/* ---------- boot ---------- */
buildAll();It=I=IMAP[hIdx];populate();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{buildAll();populate()},180)});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();
</script>
</body>
